<!DOCTYPE html>

<html lang="en"><head>

                      "on-error": "#ffffff",
                      "error": "#ba1a1a",
                      "surface-container-lowest": "#ffffff",
                      "secondary": "#904d00",
                      "surface-container-highest": "#d5e3fc",
                      "surface-bright": "#f8f9ff",
                      "outline": "#737973",
                      "on-tertiary-fixed-variant": "#444746",
                      "surface": "#f8f9ff",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#364c3c",
                      "on-secondary": "#ffffff",
                      "surface-container-high": "#dce9ff",
                      "primary-container": "#1b3022",
                      "on-primary-fixed": "#0b2013",
                      "on-error-container": "#93000a",
                      "on-secondary-fixed": "#2f1500",
                      "on-tertiary-container": "#909392",
                      "on-background": "#0d1c2e",
                      "primary-fixed": "#d0e9d4",
                      "primary-fixed-dim": "#b4cdb8",
                      "on-secondary-container": "#663500",
                      "tertiary": "#141817",
                      "inverse-primary": "#b4cdb8",
                      "inverse-on-surface": "#eaf1ff",
                      "secondary-fixed": "#ffdcc3",
                      "primary": "#061b0e",
                      "on-surface-variant": "#434843",
                      "error-container": "#ffdad6",
                      "background": "#f8f9ff",
                      "secondary-container": "#fe932c",
                      "tertiary-fixed-dim": "#c5c7c5",
                      "on-secondary-fixed-variant": "#6e3900",
                      "surface-variant": "#d5e3fc",
                      "surface-tint": "#4d6453"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",

              "spacing": {
                      "margin-desktop": "64px",
                      "gutter": "24px",
                      "max-width": "1280px",
                      "margin-mobile": "16px",
                      "unit": "8px"

              "fontFamily": {
                      "headline-lg-mobile": [

<body class="bg-surface text-on-surface h-screen flex flex-col font-body-md overflow-hidden">
<!-- Header -->
<header class="flex-none flex items-center justify-between px-6 py-4 bg-surface border-b border-outline-variant shadow-sm z-10">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">landscape</span>
<div>
<h1 class="font-headline-md text-headline-md text-primary m-0">North Star Support Bot</h1>
<div class="flex items-center gap-2 mt-1">
<span class="w-2 h-2 rounded-full bg-secondary-container inline-block"></span>
<span class="font-label-md text-label-md text-on-surface-variant">Online</span>
</div>
</div>
</div>
<a class="font-label-md text-label-md text-secondary-container hover:text-primary transition-colors" href="#">Talk to Human</a>
</header>
<!-- Chat Area -->
<main class="flex-1 overflow-y-auto p-6 md:px-margin-desktop md:py-10 flex flex-col gap-6" id="chat-container">
<!-- Bot Message -->
<div class="flex flex-col items-start max-w-3xl">
<div class="bg-primary-container text-on-primary rounded-xl rounded-tl-sm p-4 shadow-sm">
<p class="font-body-md text-body-md m-0">Welcome to basecamp. How can I help you gear up today?</p>
</div>
</div>
<!-- Quick Replies (Initial State) -->
<div class="flex flex-wrap gap-3 mt-2" id="initial-quick-replies">
<button class="px-4 py-2 rounded-full border border-primary text-primary font-label-md text-label-md bg-transparent hover:bg-surface-container-low transition-colors" onclick="handleTrackOrder()">Track Order</button>
<button class="px-4 py-2 rounded-full border border-primary text-primary font-label-md text-label-md bg-transparent hover:bg-surface-container-low transition-colors">Returns</button>
<button class="px-4 py-2 rounded-full border border-primary text-primary font-label-md text-label-md bg-transparent hover:bg-surface-container-low transition-colors">Product Advice</button>
</div>
<!-- Placeholder for dynamic content -->
<div class="flex flex-col gap-6" id="dynamic-chat-content"></div>
</main>
<!-- Input Area -->
<footer class="flex-none p-4 md:px-margin-desktop md:py-6 bg-surface border-t border-outline-variant z-10">
<div class="max-w-3xl mx-auto flex items-center gap-4 relative">
<input class="w-full bg-white border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary shadow-sm" id="chat-input" placeholder="Type your message..." type="text"/>
<button aria-label="Send message" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-primary hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined text-2xl">send</span>
</button>
</div>
</footer>
<script>
        function handleTrackOrder() {
            // Hide initial quick replies
            document.getElementById('initial-quick-replies').style.display = 'none';

            const chatContainer = document.getElementById('dynamic-chat-content');
            
            // Add User Message
            const userMsgHtml = `
                <div class="flex flex-col items-end self-end max-w-3xl">
                    <div class="bg-surface-container-high text-on-surface rounded-xl rounded-tr-sm p-4 shadow-sm">
                        <p class="font-body-md text-body-md m-0">Track Order</p>
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', userMsgHtml);

            // Add Bot Response
            setTimeout(() => {
                const botMsgHtml = `
                    <div class="flex flex-col items-start max-w-3xl">
                        <div class="bg-primary-container text-on-primary rounded-xl rounded-tl-sm p-4 shadow-sm">
                            <p class="font-body-md text-body-md m-0">Please enter your order number below.</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3 mt-2 ml-4">
                         <input type="text" placeholder="e.g. 111" class="w-48 bg-white border border-outline-variant rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary shadow-sm" id="order-input">
                         <button class="bg-secondary-container text-on-secondary-container hover:bg-secondary hover:text-on-secondary px-6 py-2 rounded-lg font-label-md text-label-md shadow-md transition-all" onclick="submitOrder()">Submit</button>
                    </div>
                `;
                chatContainer.insertAdjacentHTML('beforeend', botMsgHtml);
                scrollToBottom();
            }, 500);
        }

        function submitOrder() {
            const chatContainer = document.getElementById('dynamic-chat-content');
            const inputVal = document.getElementById('order-input').value || '111';

            // Add User Message (The submitted number)
            const userMsgHtml = `
                <div class="flex flex-col items-end self-end max-w-3xl">
                    <div class="bg-surface-container-high text-on-surface rounded-xl rounded-tr-sm p-4 shadow-sm">
                        <p class="font-body-md text-body-md m-0">${inputVal}</p>
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', userMsgHtml);

            // Hide the input fields (simulated)
            const inputArea = document.getElementById('order-input').parentElement;
            if(inputArea) inputArea.style.display = 'none';

            // Add Bot Resolution
            setTimeout(() => {
                const botMsgHtml = `
                    <div class="flex flex-col items-start max-w-3xl">
                        <div class="bg-primary-container text-on-primary rounded-xl rounded-tl-sm p-4 shadow-sm">
                            <p class="font-body-md text-body-md m-0">Order #${inputVal} is on the trail. Expected delivery: Tuesday.</p>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-3 mt-2">
                        <button class="px-4 py-2 rounded-full border border-primary text-primary font-label-md text-label-md bg-transparent hover:bg-surface-container-low transition-colors" onclick="resetChat()">Back to menu</button>
                    </div>
                `;
                chatContainer.insertAdjacentHTML('beforeend', botMsgHtml);
                scrollToBottom();
            }, 800);
        }

        function resetChat() {
             const chatContainer = document.getElementById('dynamic-chat-content');
             // Add User Message
             const userMsgHtml = `
                <div class="flex flex-col items-end self-end max-w-3xl">
                    <div class="bg-surface-container-high text-on-surface rounded-xl rounded-tr-sm p-4 shadow-sm">
                        <p class="font-body-md text-body-md m-0">Back to menu</p>
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', userMsgHtml);
            
            setTimeout(() => {
                document.getElementById('initial-quick-replies').style.display = 'flex';
                scrollToBottom();
            }, 500);
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body></html>
